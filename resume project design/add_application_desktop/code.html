<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Application - CareerStream</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@450&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f3effc",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-bright": "#fcf8ff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#302f39",
                        "primary": "#3525cd",
                        "surface-variant": "#e4e1ee",
                        "error": "#ba1a1a",
                        "primary-container": "#4f46e5",
                        "outline-variant": "#c7c4d8",
                        "on-primary-container": "#dad7ff",
                        "surface": "#fcf8ff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#a44100",
                        "surface-tint": "#4d44e3",
                        "primary-fixed-dim": "#c3c0ff",
                        "tertiary": "#7e3000",
                        "on-surface-variant": "#464555",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1b24",
                        "secondary-fixed": "#d3e4fe",
                        "secondary-container": "#d0e1fb",
                        "surface-container-low": "#f5f2ff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1b1b24",
                        "on-tertiary-container": "#ffd2be",
                        "surface-container": "#f0ecf9",
                        "on-tertiary-fixed": "#351000",
                        "secondary-fixed-dim": "#b7c8e1",
                        "inverse-primary": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-secondary-fixed-variant": "#38485d",
                        "background": "#fcf8ff",
                        "primary-fixed": "#e2dfff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-dim": "#dcd8e5",
                        "on-secondary-container": "#54647a",
                        "tertiary-fixed": "#ffdbcc",
                        "surface-container-highest": "#e4e1ee",
                        "surface-container-high": "#eae6f4",
                        "on-secondary-fixed": "#0b1c30",
                        "outline": "#777587",
                        "secondary": "#505f76",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "8px",
                        "gutter": "16px",
                        "md": "16px",
                        "xs": "4px",
                        "container-padding-mobile": "16px",
                        "container-padding-desktop": "40px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "mono-sm": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-sm": ["13px", { "lineHeight": "20px", "fontWeight": "450" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background dark:bg-surface-dim text-on-background dark:text-on-surface antialiased min-h-screen flex items-center justify-center p-md sm:p-lg">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-background/20 dark:bg-black/40 backdrop-blur-sm z-40"></div>
<!-- Modal Container -->
<div class="relative w-full max-w-2xl bg-surface dark:bg-surface-container-low rounded-xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] dark:shadow-[0_8px_24px_rgba(0,0,0,0.2)] border border-outline-variant dark:border-outline z-50 flex flex-col max-h-[921px]">
<!-- Modal Header -->
<div class="flex items-center justify-between p-lg border-b border-outline-variant dark:border-outline">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Application</h2>
<button class="p-xs text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-lg overflow-y-auto custom-scrollbar flex-1">
<form class="space-y-xl">
<!-- Section 1: Core Details -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Company Name (Error State) -->
<div class="space-y-xs col-span-1 md:col-span-2">
<label class="block font-body-sm text-body-sm font-semibold text-error" for="company">Company Name *</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-error text-error placeholder:text-error/60 rounded-lg px-md py-sm font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-error/20" id="company" name="company" placeholder="e.g. Acme Corp" type="text"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-error text-[20px]" data-icon="error">error</span>
</div>
<p class="font-body-sm text-body-sm text-error">Company name is required.</p>
</div>
<!-- Role -->
<div class="space-y-xs col-span-1 md:col-span-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="role">Role Title</label>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface placeholder:text-on-surface-variant/50 rounded-lg px-md py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="role" name="role" placeholder="e.g. Senior Frontend Engineer" type="text"/>
</div>
<!-- Job Link -->
<div class="space-y-xs col-span-1 md:col-span-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="link">Job Posting URL</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant text-[20px]" data-icon="link">link</span>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface placeholder:text-on-surface-variant/50 rounded-lg pl-[40px] pr-md py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="link" name="link" placeholder="https://..." type="url"/>
</div>
</div>
</div>
<hr class="border-outline-variant dark:border-outline"/>
<!-- Section 2: Logistics & Status -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Status Dropdown (Simulated Color-coded) -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="status">Status</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface rounded-lg pl-md pr-xl py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="status" name="status">
<option selected="" value="applied">Applied</option>
<option value="interview">Interviewing</option>
<option value="offer">Offer</option>
<option value="rejected">Rejected</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
<!-- Decorative Status Dot (simulating the color coding visually without complex JS dropdowns) -->
<div class="absolute left-md top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-primary pointer-events-none"></div>
<style> #status { padding-left: 28px; } </style>
</div>
</div>
<!-- Date Picker -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="date">Applied Date</label>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface rounded-lg px-md py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="date" name="date" type="date"/>
</div>
<!-- Location -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="location">Location</label>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface placeholder:text-on-surface-variant/50 rounded-lg px-md py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="location" name="location" placeholder="City, State" type="text"/>
</div>
<!-- Job Type -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="type">Work Model</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface rounded-lg pl-md pr-xl py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="type" name="type">
<option value="remote">Remote</option>
<option value="hybrid">Hybrid</option>
<option value="onsite">On-site</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Salary -->
<div class="space-y-xs md:col-span-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="salary">Salary Expectation</label>
<div class="relative flex items-center">
<span class="absolute left-md text-on-surface-variant font-body-md text-body-md">$</span>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface placeholder:text-on-surface-variant/50 rounded-lg pl-[28px] pr-md py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="salary" name="salary" placeholder="120,000" type="text"/>
</div>
</div>
</div>
<!-- Section 3: Notes -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="notes">Notes</label>
<textarea class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline text-on-surface placeholder:text-on-surface-variant/50 rounded-lg px-md py-sm font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-y" id="notes" name="notes" placeholder="Referral details, specific requirements, etc." rows="3"></textarea>
</div>
</form>
</div>
<!-- Modal Footer Actions -->
<div class="p-lg border-t border-outline-variant dark:border-outline bg-surface-container-lowest/50 dark:bg-inverse-surface/50 rounded-b-xl flex justify-end gap-md">
<button class="px-lg py-sm rounded-lg border border-outline-variant text-on-surface font-body-sm text-body-sm font-medium hover:bg-surface-container-high transition-colors">
                Cancel
            </button>
<button class="px-lg py-sm rounded-lg bg-primary text-on-primary font-body-sm text-body-sm font-medium hover:opacity-90 shadow-sm transition-all flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                Save Application
            </button>
</div>
</div>
</body></html>

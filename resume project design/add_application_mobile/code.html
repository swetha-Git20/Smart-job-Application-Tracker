<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add/Edit Application</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@450&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f3effc",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-bright": "#fcf8ff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#302f39",
                        "primary": "#3525cd",
                        "surface-variant": "#e4e1ee",
                        "error": "#ba1a1a",
                        "primary-container": "#4f46e5",
                        "outline-variant": "#c7c4d8",
                        "on-primary-container": "#dad7ff",
                        "surface": "#fcf8ff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#a44100",
                        "surface-tint": "#4d44e3",
                        "primary-fixed-dim": "#c3c0ff",
                        "tertiary": "#7e3000",
                        "on-surface-variant": "#464555",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1b24",
                        "secondary-fixed": "#d3e4fe",
                        "secondary-container": "#d0e1fb",
                        "surface-container-low": "#f5f2ff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1b1b24",
                        "on-tertiary-container": "#ffd2be",
                        "surface-container": "#f0ecf9",
                        "on-tertiary-fixed": "#351000",
                        "secondary-fixed-dim": "#b7c8e1",
                        "inverse-primary": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-secondary-fixed-variant": "#38485d",
                        "background": "#fcf8ff",
                        "primary-fixed": "#e2dfff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-dim": "#dcd8e5",
                        "on-secondary-container": "#54647a",
                        "tertiary-fixed": "#ffdbcc",
                        "surface-container-highest": "#e4e1ee",
                        "surface-container-high": "#eae6f4",
                        "on-secondary-fixed": "#0b1c30",
                        "outline": "#777587",
                        "secondary": "#505f76",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "8px",
                        "gutter": "16px",
                        "md": "16px",
                        "xs": "4px",
                        "container-padding-mobile": "16px",
                        "container-padding-desktop": "40px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "mono-sm": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-sm": ["13px", { "lineHeight": "20px", "fontWeight": "450" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modal Style) -->
<header class="flex justify-between items-center w-full px-container-padding-mobile h-16 fixed top-0 z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline shadow-sm">
<button class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary dark:text-primary-fixed-dim">Add Application</h1>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center" id="theme-toggle">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-20 pb-32 px-container-padding-mobile">
<form class="flex flex-col gap-lg max-w-md mx-auto">
<!-- Company -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="company">Company</label>
<input class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md shadow-sm" id="company" name="company" placeholder="e.g. Acme Corp" type="text"/>
</div>
<!-- Role -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="role">Role Title</label>
<input class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md shadow-sm" id="role" name="role" placeholder="e.g. Frontend Developer" type="text"/>
</div>
<!-- Status Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="status">Status</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg px-md py-sm appearance-none focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md shadow-sm" id="status" name="status">
<option value="applied">Applied</option>
<option value="interviewing">Interviewing</option>
<option value="offer">Offer</option>
<option value="rejected">Rejected</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-xl">expand_more</span>
</div>
</div>
</div>
<!-- Date Applied -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="date_applied">Date Applied</label>
<input class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md shadow-sm" id="date_applied" name="date_applied" type="date"/>
</div>
<!-- URL -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="url">Job Posting URL</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-xl">link</span>
<input class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg pl-10 pr-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md shadow-sm" id="url" name="url" placeholder="https://" type="url"/>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="notes">Notes</label>
<textarea class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md shadow-sm resize-none" id="notes" name="notes" placeholder="Important details, contacts, etc." rows="4"></textarea>
</div>
</form>
</main>
<!-- Bottom Sticky Action Buttons -->
<div class="fixed bottom-0 left-0 w-full bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline p-container-padding-mobile pb-safe shadow-lg z-50">
<div class="flex gap-md max-w-md mx-auto">
<button class="flex-1 bg-transparent border border-outline-variant text-on-surface-variant font-body-sm text-body-sm font-medium rounded-lg py-sm px-md hover:bg-surface-container-highest transition-colors flex items-center justify-center" type="button">
                Cancel
            </button>
<button class="flex-1 bg-primary text-on-primary font-body-sm text-body-sm font-medium rounded-lg py-sm px-md hover:opacity-90 active:scale-95 transition-all shadow-sm flex items-center justify-center" type="button">
                Save Application
            </button>
</div>
</div>
<script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('light')) {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
            } else {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
            }
        });
    </script>
</body></html>

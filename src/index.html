<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <title>CareerStream — Smart Job Application Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="description" content="CareerStream — A sleek, modern job application tracker for managing your career pipeline, tracking interviews, and analyzing offers.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS Engine with Stitch Design Tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#fcf8ff",
            "surface-variant": "#e4e1ee",
            "secondary-fixed": "#d3e4fe",
            "inverse-primary": "#c3c0ff",
            "on-tertiary-fixed": "#351000",
            "surface-bright": "#fcf8ff",
            "tertiary-fixed": "#ffdbcc",
            "primary-fixed": "#e2dfff",
            "on-tertiary-fixed-variant": "#7b2f00",
            "background": "#fcf8ff",
            "secondary-fixed-dim": "#b7c8e1",
            "on-error": "#ffffff",
            "on-tertiary": "#ffffff",
            "on-secondary-fixed": "#0b1c30",
            "outline": "#777587",
            "primary": "#3525cd",
            "on-secondary-fixed-variant": "#38485d",
            "tertiary-fixed-dim": "#ffb695",
            "on-surface-variant": "#464555",
            "tertiary": "#7e3000",
            "surface-container": "#f0ecf9",
            "on-primary-container": "#dad7ff",
            "error-container": "#ffdad6",
            "surface-container-highest": "#e4e1ee",
            "inverse-on-surface": "#f3effc",
            "on-primary": "#ffffff",
            "on-background": "#1b1b24",
            "secondary": "#505f76",
            "on-primary-fixed-variant": "#3323cc",
            "on-secondary": "#ffffff",
            "error": "#ba1a1a",
            "surface-container-high": "#eae6f4",
            "primary-fixed-dim": "#c3c0ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f2ff",
            "on-error-container": "#93000a",
            "secondary-container": "#d0e1fb",
            "on-secondary-container": "#54647a",
            "tertiary-container": "#a44100",
            "on-tertiary-container": "#ffd2be",
            "inverse-surface": "#302f39",
            "surface-dim": "#dcd8e5",
            "on-surface": "#1b1b24",
            "on-primary-fixed": "#0f0069",
            "primary-container": "#4f46e5",
            "outline-variant": "#c7c4d8",
            "surface-tint": "#4d44e3"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          spacing: {
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "32px",
            "container-padding-mobile": "16px",
            "container-padding-desktop": "40px",
            "gutter": "16px",
            "base": "8px"
          },
          fontFamily: {
            "sans": ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    /* Loading screen styling */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fcf8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    
    .dark #loading-screen {
      background: #1b1b24;
    }
    
    .loading-logo {
      width: 48px;
      height: 48px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    
    .loading-text {
      margin-top: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #1b1b24;
      font-weight: 500;
    }
    
    .dark .loading-text {
      color: #fcf8ff;
    }
  </style>
</head>
<body class="bg-background dark:bg-[#1b1b24] text-on-background dark:text-[#fcf8ff] font-sans antialiased selection:bg-primary selection:text-on-primary">
  <!-- Loading Screen -->
  <div id="loading-screen">
    <svg class="loading-logo" viewBox="0 0 32 32">
      <defs>
        <linearGradient id="loadingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#3525cd;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="6" fill="url(#loadingGrad)"/>
      <path d="M8 12 L16 8 L24 12 L24 20 L16 24 L8 20 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <path d="M8 12 L16 16 L24 12" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 16 L16 24" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="2" fill="white"/>
    </svg>
    <div class="loading-text">CareerStream</div>
  </div>
  
  <app-root></app-root>
  
  <script>
    // Remove loading screen when app is ready
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(function() {
            loadingScreen.remove();
          }, 300);
        }
      }, 500);
    });
  </script>
</body>
</html>
